name: Build and Release vulkan-nouveau-aliveos

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pacman Mirrors & Builder User
        run: |
          pacman-key --init
          pacman-key --populate archlinux

          cat << 'EOF' > /tmp/mirrorlist.new
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/mirrorlist.new
          cat /etc/pacman.d/mirrorlist >> /tmp/mirrorlist.new 2>/dev/null || true
          mv /tmp/mirrorlist.new /etc/pacman.d/mirrorlist

          pacman -Syu --noconfirm git
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Package with makepkg
        run: |
          sudo -u builder env MAKEFLAGS="-j$(nproc)" makepkg --syncdeps --noconfirm --nocheck --clean

      - name: Verify Package Contents
        run: |
          shopt -s nullglob
          pkgs=(vulkan-nouveau-aliveos-*.pkg.tar.zst)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "Expected exactly 1 package archive, found ${#pkgs[@]}: ${pkgs[*]}" >&2
            exit 1
          fi
          pkg="${pkgs[0]}"
          filelist="$(pacman -Qlp "$pkg")"
          for entry in \
            "usr/lib/libvulkan_nouveau.so" \
            "usr/share/vulkan/icd.d/nouveau_icd.json" \
            "usr/share/licenses/vulkan-nouveau-aliveos/license.rst"
          do
            if ! grep -q "$entry" <<< "$filelist"; then
              echo "Missing expected file in package: $entry" >&2
              exit 1
            fi
          done
          # actions/upload-artifact@v4 and GitHub Releases disallow ':' in filenames (e.g. epoch 1:26.3.1-3)
          for f in vulkan-nouveau-aliveos-*.pkg.tar.zst; do
            safe="${f//:/\.}"
            [ "$f" = "$safe" ] || mv "$f" "$safe"
          done

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-nouveau-aliveos-arch-pkg
          path: vulkan-nouveau-aliveos-*.pkg.tar.zst

  release:
    name: Publish GitHub Release
    needs: [build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-nouveau-aliveos-arch-pkg
          path: release-assets

      - name: Generate Checksums & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (
            cd release-assets
            sha256sum *.pkg.tar.zst > SHA256SUMS.txt
          )

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            pkgver="$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2 | tr -d "'\"")"
            pkgrel="$(grep -E '^pkgrel=' PKGBUILD | cut -d= -f2 | tr -d "'\"")"
            TAG="v${pkgver}-${pkgrel}"
          fi

          VER="${TAG#v}"
          NOTES_FILE="/tmp/release-notes.md"
          awk -v ver="$VER" '
            /^## \[/ {
              if (in_sec) exit
              if ($0 ~ "\\[(1:)?" ver "\\]") { in_sec = 1; next }
            }
            in_sec { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Prebuilt Arch Linux / AliveOS package for vulkan-nouveau-aliveos $TAG. See CHANGELOG.md for details." > "$NOTES_FILE"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "vulkan-nouveau-aliveos $TAG" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" release-assets/*.pkg.tar.zst release-assets/SHA256SUMS.txt --clobber
